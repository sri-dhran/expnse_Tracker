<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <title>Expenxe | Premium Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-wallet"></i>
                    <span>Expenxe</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-view="dashboard">
                        <i class="fas fa-th-large"></i>
                        <span>Dashboard</span>
                    </li>
                    <li class="nav-item" data-view="transactions">
                        <i class="fas fa-list"></i>
                        <span>Transactions</span>
                    </li>
                    <li class="nav-item" data-view="analytics">
                        <i class="fas fa-chart-pie"></i>
                        <span>Analytics</span>
                    </li>
                    <li class="nav-item" data-view="settings">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </li>
                    <li id="install-btn" style="display: none; align-items: center; gap: 1rem; padding: 1rem; border-radius: 12px; cursor: pointer; margin-bottom: 0.5rem; color: var(--primary-color); background-color: rgba(99, 102, 241, 0.1);">
                        <i class="fas fa-download"></i>
                        <span>Install App</span>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="User Avatar" class="avatar">
                    <div class="user-details">
                        <p class="user-name">Welcome Back</p>
                        <p class="user-status">Free Plan</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="view-title">Dashboard</h1>
                <div class="header-actions">
                    <!-- Desktop add button (hidden on mobile) -->
                    <button id="add-transaction-btn-desktop" class="btn btn-primary desktop-only">
                        <i class="fas fa-plus"></i>
                        <span>Add Transaction</span>
                    </button>
                </div>
            </header>

            <div id="dashboard-view" class="view-section active">
                <!-- Dashboard content will be injected here -->
            </div>

            <div id="transactions-view" class="view-section">
                <!-- Transactions content will be injected here -->
            </div>

            <div id="analytics-view" class="view-section">
                <!-- Analytics content will be injected here -->
            </div>

            <div id="settings-view" class="view-section">
                <!-- Settings content will be injected here -->
            </div>
            
            <!-- Floating Action Button for Mobile -->
            <button id="fab-add" class="fab-btn mobile-only">
                <i class="fas fa-plus"></i>
            </button>
        </main>
    </div>

    <!-- Bottom Sheet Architecture -->
    <div id="sheet-overlay" class="sheet-overlay"></div>

    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-drag-handle"></div>
        <div class="sheet-header">
            <h2 id="sheet-title">Add Transaction</h2>
            <button class="close-sheet">&times;</button>
        </div>
        <div class="sheet-content-container">
            
            <!-- Transaction Form View -->
            <div id="sheet-transaction-form" class="sheet-view active">
                <form id="transaction-form">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                        <div class="quick-amounts">
                            <button type="button" class="quick-amount-btn" data-val="100">+100</button>
                            <button type="button" class="quick-amount-btn" data-val="500">+500</button>
                            <button type="button" class="quick-amount-btn" data-val="1000">+1000</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <div class="custom-select-trigger" id="category-trigger">
                            <span id="selected-category-text">Select Category...</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <input type="hidden" id="category" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Lunch at Cafe..." required>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Save Transaction</button>
                </form>
            </div>

            <!-- Category Selection View -->
            <div id="sheet-category-selection" class="sheet-view">
                <div class="category-list">
                    <div class="category-item" data-value="Food"><i class="fas fa-utensils"></i> Food & Dining</div>
                    <div class="category-item" data-value="Transport"><i class="fas fa-car"></i> Transportation</div>
                    <div class="category-item" data-value="Shopping"><i class="fas fa-shopping-bag"></i> Shopping</div>
                    <div class="category-item" data-value="Entertainment"><i class="fas fa-film"></i> Entertainment</div>
                    <div class="category-item" data-value="Health"><i class="fas fa-heartbeat"></i> Health & Wellness</div>
                    <div class="category-item" data-value="Income"><i class="fas fa-money-bill-wave"></i> Salary/Income</div>
                    <div class="category-item" data-value="Other"><i class="fas fa-box"></i> Other</div>
                </div>
            </div>

            <!-- Filter View -->
            <div id="sheet-filter-selection" class="sheet-view">
                <!-- Filters moved here in script.js, or duplicate the UI here -->
                <div class="form-group">
                    <label>Sort By</label>
                    <select id="sheet-sort-order">
                        <option value="latest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="highest">Highest Amount</option>
                        <option value="lowest">Lowest Amount</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="sheet-filter-date-from">
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="sheet-filter-date-to">
                </div>
                <button id="apply-filters-btn" class="btn btn-primary full-width">Apply Filters</button>
            </div>

            <!-- Transaction Details View -->
            <div id="sheet-transaction-details" class="sheet-view">
                <div id="details-content" style="text-align: center; padding: 2rem 0;">
                    <!-- Details injected via JS -->
                </div>
                <div class="action-btns" style="justify-content: center; margin-top: 1rem;">
                    <button id="details-edit-btn" class="btn btn-primary">Edit</button>
                    <button id="details-delete-btn" class="btn btn-danger">Delete</button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
